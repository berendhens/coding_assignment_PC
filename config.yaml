seed: 67 # hehe

data:
  dataset_name: "ChengsenWang/TSQA"
  cache_dir: "./data/raw"
  val_split: 0.2

# Most hardcoded, but listed here as info
preprocessing:
  normalization: "zscore" # per-sample
  epsilon: 1.0e-8         # avoid div-by-zero on constant series

model:
  backbone: "cnn1d"
  conv_channels: [32, 64, 128]
  kernel_size: 5

training:
  batch_size: 64
  epochs: 2
  learning_rate: 0.001
  optimizer: "adam"

paths:
  artifacts_dir: "./data"
  label_path: "./data/labels.json"
  output_dir: "./outputs"