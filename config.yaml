# config.yaml
seed: 67 # hehe

data:
  dataset_name: "ChengsenWang/TSQA"
  cache_dir: "./data/raw"
  sequence_length: 64 # shortest sequence length
  val_split: 0.2

preprocessing:
  normalization: "zscore"    # per-sample, as discussed
  epsilon: 1.0e-8             # avoid div-by-zero on constant series

# Comes in testing and training ########
model:
  backbone: "cnn1d"
  conv_channels: [32, 64, 128]
  kernel_size: 5
  dropout: 0.2

training:
  batch_size: 64
  epochs: 20
  learning_rate: 0.001
  optimizer: "adam"
#########################################

paths:
  artifacts_dir: "./data"
  label_path: "./data/labels.json"
  output_dir: "./outputs"